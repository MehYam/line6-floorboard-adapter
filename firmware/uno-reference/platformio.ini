; UNO golden reference for the Line 6 Floor Board (phase 1, step 5)
; build + flash:  pio run -t upload
; serial console: pio device monitor   (115200, type `help`)

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
